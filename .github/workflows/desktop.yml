name: Pacote desktop (Windows)

# Gera dist/SistemaDeControle-win-x64.zip. Rode manualmente (aba Actions) ou crie uma
# tag v* (ex.: git tag v1.0.0 && git push --tags) para anexar o zip a uma Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: scripts/build-desktop.sh win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: SistemaDeControle-win-x64
          path: dist/SistemaDeControle-win-x64.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SistemaDeControle-win-x64.zip
